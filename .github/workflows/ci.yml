name: CI

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check . --output-format=github
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: ShellCheck
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck install.sh uninstall.sh tests/integration/container-check.sh \
            src/distroforge/assets/completions/distroforge.bash

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install
        run: |
          sudo apt-get install -y -qq desktop-file-utils
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit + UI tests
        run: pytest --cov=distroforge --cov-report=term-missing --cov-fail-under=85 --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - name: Wheel contains data files
        run: |
          unzip -l dist/*.whl | grep -q "distroforge/catalog/data/system.yaml"
          unzip -l dist/*.whl | grep -q "distroforge/catalog/data/profiles/20-developer.yaml"
          unzip -l dist/*.whl | grep -q "distroforge/assets/distroforge.svg"
          unzip -l dist/*.whl | grep -q "distroforge/tui/distroforge.tcss"
      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/distroforge --version
          /tmp/v/bin/distroforge doctor
          /tmp/v/bin/distroforge apply --profile developer --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  integration:
    name: Real install (${{ matrix.image }})
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - debian:12
          - fedora:latest
          - archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run DistroForge inside ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/src:ro" ${{ matrix.image }} bash /src/tests/integration/container-check.sh
