# DistroForge Configuration
# Customize your setup preferences here
# ─────────────────────────────────────

# ── User Identity ──────────────────────────────────
user:
  name: "Hamid Alami"
  email: "hamidalamisdev@proton.me"
  github_username: "rezalabshq"
  machine_name: "rezalabshq"
  ssh_key_comment: "hamid@rezalabs-pop"

# ── Shell Preferences ──────────────────────────────
shell:
  default: "zsh" # zsh | bash | fish
  prompt: "starship" # starship | powerlevel10k | pure
  oh_my_zsh: true
  plugins:
    - git
    - zsh-autosuggestions
    - zsh-syntax-highlighting
    - docker
    - node
    - npm
    - python
    - sudo
  extra_zshrc_lines:
    - "setopt NO_BANG_HIST" # Prevent ! history expansion issues

# ── Development Environment ────────────────────────
dev:
  node:
    manager: "fnm" # fnm | nvm
    version: "lts" # lts | latest | 20 | 22
    global_packages:
      - pnpm
      - yarn
      - typescript
      - ts-node
      - tsx
      - nodemon
      - "@anthropic-ai/claude-code"
      - expo-cli
      - eas-cli

  python:
    manager: "pyenv" # pyenv | system
    version: "3.14" # Major.minor — script finds latest patch
    install_uv: true # Fast pip replacement

  docker: true # Install Docker Engine + Compose
  github_cli: true # Install gh CLI + SSH key setup

  # Additional language runtimes (set to true to install)
  languages:
    rust: true # Useful for modern tooling
    go: true
    java: true # OpenJDK 21 — needed for Android/Kotlin
    dotnet: true # .NET SDK 8.0 for C#
    cpp: true # build-essential (gcc, g++, make, cmake)

# ── Code Editors ───────────────────────────────────
editors:
  vscode: true

# ── Gaming ─────────────────────────────────────────
gaming:
  enabled: true
  steam: true
  protonup_qt: true # GUI for managing Proton versions
  gamemode: true # Feral Gamemode — optimizes CPU governor
  mangohud: true # Performance overlay
  lutris: true # Non-Steam game manager

# ── Applications (Flatpak) ─────────────────────────
apps:
  flatpak:
    - com.brave.Browser
    - com.discordapp.Discord
    - com.slack.Slack
    - md.obsidian.Obsidian
    - com.spotify.Client
    - com.getpostman.Postman
    - io.dbeaver.DBeaverCommunity
    - org.videolan.VLC

# ── Fonts ──────────────────────────────────────────
fonts:
  nerd_fonts:
    - JetBrainsMono
    - FiraCode

# ── System Essentials ──────────────────────────────
system:
  # Core packages always installed
  essentials:
    - build-essential
    - git
    - curl
    - wget
    - htop
    - btop
    - neofetch
    - tree
    - unzip
    - zip
    - gnupg
    - ca-certificates
    - software-properties-common
    - apt-transport-https
    - lsb-release
    - net-tools
    - openssh-client
    - openssh-server
    - gcc
    - g++
    - make
    - cmake
    - pkg-config

# ── Quality of Life ────────────────────────────────
qol:
  firewall: true # Enable UFW
  ssd_trim: true # Enable fstrim.timer
  swappiness: 10 # Lower swappiness for SSDs (default 60)

# ── RGB / Peripherals ─────────────────────────────
peripherals:
  openrgb: true
  solaar: true # Logitech wireless device manager
  piper: true # Gaming mouse configuration
  input_remapper: true # Advanced button remapping
