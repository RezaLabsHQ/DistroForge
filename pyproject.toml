[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "distroforge"
dynamic = ["version"]
description = "A distro-agnostic Linux setup toolbox with a full-screen terminal UI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hamid Alami — Reza Labs HQ" }]
keywords = ["linux", "setup", "tui", "textual", "flatpak", "apt", "dnf", "pacman", "dotfiles"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=1.0,<9",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-textual-snapshot>=1.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/RezaLabsHQ/DistroForge"
Repository = "https://github.com/RezaLabsHQ/DistroForge"
Issues = "https://github.com/RezaLabsHQ/DistroForge/issues"
Changelog = "https://github.com/RezaLabsHQ/DistroForge/blob/main/CHANGELOG.md"

[project.scripts]
distroforge = "distroforge.cli:main"

[tool.hatch.version]
path = "src/distroforge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/distroforge"]

[tool.hatch.build.targets.sdist]
include = [
    "src/distroforge", "tests", "scripts", "install.sh", "uninstall.sh",
    "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md", "CONTRIBUTING.md",
]

# ── Ruff ───────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "S", "ASYNC", "PTH"]
ignore = [
    "S101",   # assert is fine for invariants/tests
    "S603",   # subprocess without shell — that's exactly our policy
    "S607",   # partial executable paths are resolved by PATH on purpose
    "PTH123", # open() is fine
    "RUF001", # ambiguous unicode (icons are intentional)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH", "E501"]

[tool.ruff.lint.flake8-bandit]
# shell=True is banned everywhere (S602/S604 stay enabled).

# ── Pytest ─────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: needs podman/docker and network (run with -m integration)",
]

# ── Coverage ───────────────────────────────────────
[tool.coverage.run]
source = ["distroforge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# ── Mypy ───────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["distroforge"]

[[tool.mypy.overrides]]
module = ["distroforge.tui.*"]
# Textual's message/handler idioms are loosely typed; keep strictness elsewhere.
disallow_untyped_decorators = false
disallow_subclassing_any = false
